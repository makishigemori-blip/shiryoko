<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資料庫 | Shiryō-ko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --paper:#ECE8DC;
    --paper-deep:#E1DCC9;
    --card:#FBF9F3;
    --ink:#242320;
    --ink-soft:#6b665c;
    --line:#cfc8b2;
    --accent:#2F6F5E;
    --accent-soft:#E1EBE4;
    --mustard:#B5852B;
    --danger:#A8402F;
    --danger-soft:#F3E4DF;
    --word:#33578F;
    --pdf:#A8402F;
    --excel:#2F6F5E;
    --text:#8A6D1D;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(255,255,255,.35), transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1080px;margin:0 auto;padding:40px 24px 80px;}

  /* ---- Masthead ---- */
  .masthead{
    text-align:center;
    padding-bottom:22px;
    margin-bottom:28px;
    border-bottom:3px double var(--line);
  }
  .masthead-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.28em;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .masthead h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:42px;
    margin:0 0 8px;
    letter-spacing:.04em;
  }
  .masthead .tagline{
    color:var(--ink-soft);
    font-size:14px;
    margin:0;
  }

  /* ---- Search ---- */
  .search-wrap{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:16px;
    box-shadow:0 1px 0 rgba(0,0,0,.03);
  }
  .search-row{
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid var(--line);
    padding-bottom:12px;
    margin-bottom:12px;
  }
  .search-row svg{flex:none;color:var(--ink-soft);}
  #searchInput{
    flex:1;
    border:none;
    background:transparent;
    outline:none;
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-size:16px;
    color:var(--ink);
    padding:4px 0;
  }
  #searchInput::placeholder{color:#a39d8c;}
  .filter-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.03em;
    padding:6px 12px;
    border-radius:20px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .15s ease;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent);}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  /* ---- Toolbar ---- */
  .toolbar{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;}
  button{font-family:inherit;cursor:pointer;}
  .btn{
    font-size:14px;
    font-weight:500;
    padding:10px 16px;
    border-radius:var(--radius);
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    transition:all .15s ease;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:#26594b;color:#fff;}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft);}
  .btn-ghost:hover{color:var(--ink);}
  .btn-danger{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);}
  .btn-danger:hover{background:var(--danger);color:#fff;}
  .btn-icon{
    border:none;background:transparent;color:var(--ink-soft);font-size:18px;
    line-height:1;padding:4px 8px;border-radius:4px;
  }
  .btn-icon:hover{background:var(--paper-deep);color:var(--ink);}
  .toolbar-spacer{flex:1;}

  #statusBar{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--accent);
    margin:-14px 0 18px;
    min-height:16px;
  }

  /* ---- Cards grid ---- */
  .cards-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:18px;
  }
  .card{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px 18px 18px;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card::before{
    content:'';
    position:absolute;
    top:9px;left:50%;
    transform:translateX(-50%);
    width:13px;height:13px;
    border-radius:50%;
    background:var(--paper);
    box-shadow:0 0 0 3px var(--card), inset 0 1px 2px rgba(0,0,0,.18);
    border:1px solid var(--line);
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 22px rgba(36,35,32,.09);
    border-color:var(--accent);
  }
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .stamp{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.08em;
    font-weight:600;
    padding:3px 7px;
    border:1.4px solid currentColor;
    border-radius:3px;
    transform:rotate(-3deg);
  }
  .stamp.word{color:var(--word);}
  .stamp.pdf{color:var(--pdf);}
  .stamp.excel{color:var(--excel);}
  .stamp.text{color:var(--text);}
  .card-date{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);}
  .card-title{
    font-family:'Shippori Mincho',serif;
    font-weight:600;
    font-size:17px;
    margin:0 0 8px;
    line-height:1.4;
  }
  .card-snippet{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.6;
    margin:0 0 12px;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .card-snippet mark{background:var(--mustard);color:#fff;padding:0 2px;border-radius:2px;}
  .card-tags{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--accent);
    background:var(--accent-soft);
    padding:2px 8px;
    border-radius:10px;
  }

  /* ---- Empty state ---- */
  .empty-state{
    text-align:center;
    padding:70px 20px;
    color:var(--ink-soft);
    border:1px dashed var(--line);
    border-radius:var(--radius);
    background:rgba(255,255,255,.3);
  }
  .empty-state h3{
    font-family:'Shippori Mincho',serif;
    font-size:20px;
    color:var(--ink);
    margin:0 0 8px;
  }
  .empty-state p{margin:0;font-size:13px;}

  /* ---- Modal ---- */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(36,35,32,.45);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    z-index:50;
  }
  .modal{
    background:var(--card);
    border-radius:6px;
    width:100%;max-width:520px;
    max-height:86vh;
    overflow-y:auto;
    padding:26px 28px 24px;
    box-shadow:0 24px 60px rgba(0,0,0,.25);
  }
  .modal h2{
    font-family:'Shippori Mincho',serif;
    font-size:22px;
    margin:0 0 18px;
  }
  .modal label{
    display:block;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:14px;
    font-weight:500;
  }
  .modal input, .modal textarea{
    display:block;
    width:100%;
    margin-top:6px;
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-size:14px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#fff;
    color:var(--ink);
    outline:none;
    resize:vertical;
  }
  .modal input:focus, .modal textarea:focus{border-color:var(--accent);}
  .modal textarea{min-height:140px;line-height:1.6;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}
  .drop-zone{
    border:2px dashed var(--line);
    border-radius:var(--radius);
    padding:36px 16px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    cursor:pointer;
    transition:border-color .15s ease,color .15s ease;
  }
  .drop-zone:hover, .drop-zone.dragover{border-color:var(--accent);color:var(--accent);}
  .drop-zone .formats{font-family:'IBM Plex Mono',monospace;font-size:11px;margin-top:6px;}
  .upload-divider{
    display:flex;align-items:center;gap:10px;
    margin:14px 0;
    color:var(--ink-soft);
    font-size:11px;
    font-family:'IBM Plex Mono',monospace;
  }
  .upload-divider::before, .upload-divider::after{
    content:'';flex:1;height:1px;background:var(--line);
  }
  .progress-list{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    max-height:120px;
    overflow-y:auto;
    margin-top:10px;
    line-height:1.7;
  }

  .detail-header{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .detail-header h2{margin:0;flex:1;}
  .detail-meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-bottom:12px;
  }
  .detail-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .detail-content{
    white-space:pre-wrap;
    word-break:break-word;
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-size:14px;
    line-height:1.85;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
    max-height:44vh;
    overflow-y:auto;
    margin:0 0 18px;
  }
  .detail-content mark{background:var(--mustard);color:#fff;padding:0 2px;border-radius:2px;}

  /* ---- Toast ---- */
  .toast{
    position:fixed;
    bottom:24px;left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:var(--paper);
    font-size:13px;
    padding:11px 20px;
    border-radius:20px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
    z-index:100;
  }

  @media (max-width:520px){
    .masthead h1{font-size:32px;}
    .toolbar .btn{flex:1;}
  }
  [hidden]{display:none !important;}
</style>
</head>
<body>
<div class="app">

  <header class="masthead">
    <div class="masthead-label">SHIRYŌ-KO · 資料庫</div>
    <h1>資料庫</h1>
    <p class="tagline">散らばった資料をひとつの棚に。探せば、すぐ出てくる。</p>
  </header>

  <div class="search-wrap">
    <div class="search-row">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" placeholder="キーワードで検索…（タイトル・本文・タグ）">
    </div>
    <div class="filter-chips" id="filterChips"></div>
  </div>

  <div class="toolbar">
    <button class="btn btn-primary" id="btnPaste">＋ 貼り付けて追加</button>
    <button class="btn" id="btnUpload">＋ ファイルを取り込む</button>
    <div class="toolbar-spacer"></div>
    <button class="btn btn-ghost" id="btnExport">書き出し（バックアップ）</button>
    <button class="btn btn-ghost" id="btnImport">読み込み</button>
    <button class="btn btn-ghost" id="btnClearAll">全データを削除</button>
    <input type="file" id="fileInput" multiple hidden accept=".docx,.pdf,.xlsx,.xls,.txt,.md,.csv">
    <input type="file" id="folderInput" hidden webkitdirectory directory multiple>
    <input type="file" id="importInput" hidden accept=".json">
  </div>

  <div id="statusBar"></div>

  <div id="cardsGrid" class="cards-grid"></div>

  <div id="emptyState" class="empty-state" hidden>
    <h3>まだ資料がありません</h3>
    <p>「貼り付けて追加」か「ファイルを取り込む」から、最初の1件を登録してください。</p>
  </div>
</div>

<!-- Paste modal -->
<div class="modal-overlay" id="pasteModal" hidden>
  <form class="modal" id="pasteForm">
    <h2>資料を貼り付け</h2>
    <label>タイトル
      <input id="pasteTitle" required placeholder="例：〇〇プロジェクト議事録 0708">
    </label>
    <label>本文
      <textarea id="pasteContent" required placeholder="ここにメモや文章を貼り付けてください"></textarea>
    </label>
    <label>タグ（カンマ区切り・任意）
      <input id="pasteTags" placeholder="例：会議, 顧客A, 予算">
    </label>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" data-close>キャンセル</button>
      <button type="submit" class="btn btn-primary">保存する</button>
    </div>
  </form>
</div>

<!-- Upload modal -->
<div class="modal-overlay" id="uploadModal" hidden>
  <div class="modal">
    <h2>ファイルを取り込む</h2>
    <div class="drop-zone" id="dropZone">
      クリックまたはドラッグ＆ドロップでファイルを追加
      <div class="formats">対応形式: .docx / .pdf / .xlsx / .xls / .txt / .md / .csv</div>
    </div>
    <div class="upload-divider"><span>または</span></div>
    <div class="drop-zone" id="folderZone">
      フォルダを丸ごと取り込む
      <div class="formats">中の対応ファイルをまとめてスキャンします（Google Drive / OneDriveの同期フォルダもOK）</div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" data-close>閉じる</button>
    </div>
  </div>
</div>

<!-- Detail modal -->
<div class="modal-overlay" id="detailModal" hidden>
  <div class="modal detail-modal">
    <div class="detail-header">
      <span class="stamp" id="detailStamp"></span>
      <h2 id="detailTitle"></h2>
      <button class="btn-icon" data-close>✕</button>
    </div>
    <div class="detail-meta" id="detailMeta"></div>
    <div class="detail-tags" id="detailTags"></div>
    <div class="detail-content" id="detailContent"></div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="btnDelete">この資料を削除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
const STORAGE_KEY = 'shiryoko-notes-v1';
const TYPE_LABEL = {word:'WORD', pdf:'PDF', excel:'XLSX', text:'TEXT'};
const FILTERS = [
  {key:'all', label:'すべて'},
  {key:'word', label:'Word'},
  {key:'pdf', label:'PDF'},
  {key:'excel', label:'Excel'},
  {key:'text', label:'テキスト'},
];

let notes = [];
let activeFilter = 'all';
let searchQuery = '';
let activeDetailId = null;

const $ = (sel) => document.querySelector(sel);
const cardsGrid = $('#cardsGrid');
const emptyState = $('#emptyState');
const statusBar = $('#statusBar');
const filterChips = $('#filterChips');

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ---------- Storage ----------
// This app is meant to be saved and opened as a standalone HTML file in a
// normal browser, so data is kept in the browser's localStorage (tied to
// this file/browser). Use "書き出し" regularly to back up your data as a
// JSON file, since local storage can be cleared if you clear browser data.
function loadNotes(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    notes = raw ? JSON.parse(raw) : [];
  }catch(e){
    console.error(e);
    notes = [];
  }
  render();
}

function saveNotes(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
  }catch(e){
    console.error(e);
    showToast('保存に失敗しました。ブラウザのストレージ容量をご確認ください');
  }
}

// ---------- Rendering ----------
function renderFilterChips(){
  filterChips.innerHTML = '';
  FILTERS.forEach(f=>{
    const btn = document.createElement('button');
    btn.className = 'chip' + (activeFilter===f.key ? ' active' : '');
    btn.textContent = f.label;
    btn.addEventListener('click', ()=>{ activeFilter = f.key; render(); });
    filterChips.appendChild(btn);
  });
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlightSnippet(content, query){
  const plain = content.replace(/\s+/g,' ').trim();
  if(!query){
    return escapeHtml(plain.slice(0,140)) + (plain.length>140 ? '…' : '');
  }
  const lower = plain.toLowerCase();
  const idx = lower.indexOf(query.toLowerCase());
  if(idx === -1){
    return escapeHtml(plain.slice(0,140)) + (plain.length>140 ? '…' : '');
  }
  const start = Math.max(0, idx - 40);
  const end = Math.min(plain.length, idx + query.length + 60);
  let snippet = plain.slice(start, end);
  snippet = escapeHtml(snippet);
  const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'ig');
  snippet = snippet.replace(re, '<mark>$1</mark>');
  return (start>0?'…':'') + snippet + (end<plain.length?'…':'');
}

function matchesSearch(note, query){
  if(!query) return true;
  const q = query.toLowerCase();
  return note.title.toLowerCase().includes(q)
    || note.content.toLowerCase().includes(q)
    || note.tags.some(t=>t.toLowerCase().includes(q));
}

function formatDate(ts){
  const d = new Date(ts);
  return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
}

function render(){
  renderFilterChips();
  const filtered = notes.filter(n =>
    (activeFilter==='all' || n.type===activeFilter) && matchesSearch(n, searchQuery)
  );

  cardsGrid.innerHTML = '';
  if(filtered.length === 0){
    emptyState.hidden = false;
    emptyState.querySelector('h3').textContent = notes.length===0 ? 'まだ資料がありません' : '見つかりませんでした';
    emptyState.querySelector('p').textContent = notes.length===0
      ? '「貼り付けて追加」か「ファイルを取り込む」から、最初の1件を登録してください。'
      : '検索条件やフィルタを変えてお試しください。';
    return;
  }
  emptyState.hidden = true;

  filtered.forEach(note=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-top">
        <span class="stamp ${note.type}">${TYPE_LABEL[note.type]}</span>
        <span class="card-date">${formatDate(note.createdAt)}</span>
      </div>
      <h3 class="card-title">${escapeHtml(note.title)}</h3>
      <p class="card-snippet">${highlightSnippet(note.content, searchQuery)}</p>
      <div class="card-tags">${note.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
    `;
    card.addEventListener('click', ()=>openDetail(note.id));
    cardsGrid.appendChild(card);
  });
}

// ---------- Toast / status ----------
let toastTimer;
function showToast(msg){
  const toast = $('#toast');
  toast.textContent = msg;
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ toast.hidden = true; }, 2600);
}
function setStatus(msg){ statusBar.textContent = msg; }
function clearStatus(){ statusBar.textContent = ''; }

// ---------- Modals ----------
function openModal(id){ $(id).hidden = false; }
function closeModal(id){ $(id).hidden = true; }
document.querySelectorAll('[data-close]').forEach(btn=>{
  btn.addEventListener('click', (e)=>{
    e.target.closest('.modal-overlay').hidden = true;
  });
});
document.querySelectorAll('.modal-overlay').forEach(ov=>{
  ov.addEventListener('click', (e)=>{ if(e.target===ov) ov.hidden = true; });
});

// ---------- Paste flow ----------
$('#btnPaste').addEventListener('click', ()=>{
  $('#pasteForm').reset();
  openModal('#pasteModal');
});
$('#pasteForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const title = $('#pasteTitle').value.trim();
  const content = $('#pasteContent').value.trim();
  const tags = $('#pasteTags').value.split(',').map(t=>t.trim()).filter(Boolean);
  if(!title || !content) return;
  const note = {
    id: crypto.randomUUID(),
    title, content, tags,
    type: 'text',
    source: 'paste',
    createdAt: Date.now()
  };
  notes.unshift(note);
  saveNotes();
  render();
  closeModal('#pasteModal');
  showToast('保存しました: ' + title);
});

// ---------- Upload flow (single files) ----------
const fileInput = $('#fileInput');
const dropZone = $('#dropZone');
$('#btnUpload').addEventListener('click', ()=> openModal('#uploadModal'));
dropZone.addEventListener('click', ()=> fileInput.click());
dropZone.addEventListener('dragover', (e)=>{ e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', ()=> dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e)=>{
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', (e)=>{
  handleFiles(e.target.files);
  fileInput.value = '';
});

const SUPPORTED_EXT = ['docx','pdf','xlsx','xls','txt','md','csv'];

// Returns { type, content } or null if unsupported / empty.
async function extractContent(file){
  const ext = file.name.split('.').pop().toLowerCase();
  let type, content;

  if(ext === 'docx'){
    type = 'word';
    const buf = await file.arrayBuffer();
    const result = await mammoth.extractRawText({arrayBuffer: buf});
    content = result.value;
  } else if(ext === 'pdf'){
    type = 'pdf';
    content = await extractPdfText(file);
  } else if(ext === 'xlsx' || ext === 'xls'){
    type = 'excel';
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    content = wb.SheetNames.map(name=>{
      const sheet = wb.Sheets[name];
      return `[${name}]\n` + XLSX.utils.sheet_to_csv(sheet);
    }).join('\n\n');
  } else if(['txt','md','csv'].includes(ext)){
    type = 'text';
    content = await file.text();
  } else {
    return null;
  }

  content = (content || '').trim();
  return content ? {type, content} : null;
}

async function extractPdfText(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let text = '';
  for(let i=1; i<=pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it=>it.str).join(' ') + '\n\n';
  }
  return text;
}

async function handleFiles(fileList){
  const files = Array.from(fileList);
  if(files.length === 0) return;
  closeModal('#uploadModal');
  for(const file of files){
    await importFile(file);
  }
  clearStatus();
}

async function importFile(file){
  setStatus(`取り込み中… ${file.name}`);
  try{
    const extracted = await extractContent(file);
    if(!extracted){
      showToast(`未対応、またはテキストを抽出できませんでした: ${file.name}`);
      return;
    }
    const note = {
      id: crypto.randomUUID(),
      title: file.name.replace(/\.[^/.]+$/, ''),
      content: extracted.content,
      type: extracted.type,
      tags: [],
      source: 'file',
      fileName: file.name,
      filePath: file.name,
      createdAt: Date.now()
    };
    notes.unshift(note);
    saveNotes();
    render();
    showToast('追加しました: ' + note.title);
  }catch(err){
    console.error(err);
    showToast(`取り込みに失敗しました: ${file.name}`);
  }
}

// ---------- Upload flow (whole folder) ----------
const folderInput = $('#folderInput');
const folderZone = $('#folderZone');
folderZone.addEventListener('click', ()=> folderInput.click());
folderInput.addEventListener('change', (e)=>{
  handleFolderFiles(e.target.files);
  folderInput.value = '';
});

async function handleFolderFiles(fileList){
  const allFiles = Array.from(fileList);
  if(allFiles.length === 0) return;
  closeModal('#uploadModal');

  const existingPaths = new Set(
    notes.filter(n=>n.filePath).map(n=>n.filePath)
  );

  const targets = allFiles.filter(f=>{
    const ext = f.name.split('.').pop().toLowerCase();
    return SUPPORTED_EXT.includes(ext) && !f.name.startsWith('.') && !f.name.startsWith('~$');
  });

  let added = 0, skippedDup = 0, failed = 0;
  const skippedUnsupported = allFiles.length - targets.length;

  for(let i=0; i<targets.length; i++){
    const file = targets[i];
    const path = file.webkitRelativePath || file.name;
    setStatus(`フォルダ取り込み中… ${i+1} / ${targets.length}（${file.name}）`);

    if(existingPaths.has(path)){
      skippedDup++;
      continue;
    }
    try{
      const extracted = await extractContent(file);
      if(!extracted){ failed++; continue; }
      const note = {
        id: crypto.randomUUID(),
        title: file.name.replace(/\.[^/.]+$/, ''),
        content: extracted.content,
        type: extracted.type,
        tags: [],
        source: 'folder',
        fileName: file.name,
        filePath: path,
        createdAt: Date.now()
      };
      notes.push(note);
      existingPaths.add(path);
      added++;
    }catch(err){
      console.error(err);
      failed++;
    }
  }

  notes.sort((a,b)=> b.createdAt - a.createdAt);
  saveNotes();
  render();
  clearStatus();

  const parts = [`${added}件を追加しました`];
  if(skippedDup) parts.push(`重複スキップ ${skippedDup}件`);
  if(skippedUnsupported) parts.push(`対応外 ${skippedUnsupported}件`);
  if(failed) parts.push(`抽出失敗 ${failed}件`);
  showToast(parts.join(' / '));
}

// ---------- Detail view ----------
function openDetail(id){
  const note = notes.find(n=>n.id===id);
  if(!note) return;
  activeDetailId = id;
  $('#detailStamp').textContent = TYPE_LABEL[note.type];
  $('#detailStamp').className = 'stamp ' + note.type;
  $('#detailTitle').textContent = note.title;
  const metaParts = [formatDate(note.createdAt)];
  if(note.fileName) metaParts.push(note.fileName);
  const sourceLabel = note.source === 'folder' ? 'フォルダ取り込み' : (note.source === 'file' ? 'ファイル取り込み' : '手入力');
  metaParts.push(sourceLabel);
  $('#detailMeta').textContent = metaParts.join(' ・ ');
  $('#detailTags').innerHTML = note.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('');
  $('#detailContent').innerHTML = searchQuery
    ? highlightFull(note.content, searchQuery)
    : escapeHtml(note.content);
  openModal('#detailModal');
}

function highlightFull(content, query){
  const escaped = escapeHtml(content);
  if(!query) return escaped;
  const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'ig');
  return escaped.replace(re, '<mark>$1</mark>');
}

$('#btnDelete').addEventListener('click', ()=>{
  if(!activeDetailId) return;
  notes = notes.filter(n=>n.id !== activeDetailId);
  saveNotes();
  render();
  closeModal('#detailModal');
  showToast('削除しました');
});

// ---------- Search ----------
let searchDebounce;
$('#searchInput').addEventListener('input', (e)=>{
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(()=>{
    searchQuery = e.target.value.trim();
    render();
  }, 150);
});

// ---------- Export / Import ----------
$('#btnExport').addEventListener('click', ()=>{
  if(notes.length === 0){ showToast('書き出す資料がありません'); return; }
  const blob = new Blob([JSON.stringify(notes, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `shiryoko-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('バックアップを書き出しました');
});

const importInput = $('#importInput');
$('#btnImport').addEventListener('click', ()=> importInput.click());
importInput.addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  importInput.value = '';
  if(!file) return;
  try{
    const text = await file.text();
    const imported = JSON.parse(text);
    if(!Array.isArray(imported)) throw new Error('invalid format');
    const existingIds = new Set(notes.map(n=>n.id));
    let added = 0;
    imported.forEach(n=>{
      if(n && n.id && !existingIds.has(n.id)){
        notes.push(n);
        existingIds.add(n.id);
        added++;
      }
    });
    notes.sort((a,b)=> b.createdAt - a.createdAt);
    saveNotes();
    render();
    showToast(`${added}件を読み込みました`);
  }catch(err){
    console.error(err);
    showToast('読み込みに失敗しました。ファイル形式をご確認ください');
  }
});

// ---------- Clear all ----------
$('#btnClearAll').addEventListener('click', async ()=>{
  if(notes.length === 0) return;
  if(!confirm('すべての資料を削除します。よろしいですか？')) return;
  notes = [];
  saveNotes();
  render();
  showToast('すべて削除しました');
});

loadNotes();
